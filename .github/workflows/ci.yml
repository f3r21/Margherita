name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Lint hook script
        run: bash -n scripts/statusline-indicator.sh

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: make build
